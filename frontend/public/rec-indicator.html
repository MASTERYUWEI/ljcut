<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>LJCUT 錄製中</title>
    <style>
        /* 視窗本身不透明（Rust 端用視窗區域裁成藥丸形），不要用透明背景或陰影：
           WebView2 透明視窗在 Windows 10 每秒重繪時周圍會破圖，陰影也會被視窗邊界切掉。 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14141c;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif;
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 100%;
            padding: 0 6px 0 12px;
            -webkit-app-region: drag;
            cursor: grab;
        }

        .bar:active {
            cursor: grabbing;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ff3b30;
            animation: pulse 1.2s infinite;
            flex: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        .timer {
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 40px;
            line-height: 1;
        }

        .stop {
            -webkit-app-region: no-drag;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #ff3b30;
            color: #fff;
            border: none;
            border-radius: 999px;
            height: 22px;
            padding: 0 10px 0 8px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .stop::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 1.5px;
        }

        .stop:hover {
            background: #e0342b;
        }
    </style>
</head>

<body>
    <div class="bar" title="錄影中（這條不會錄進影片，可拖曳移開）">
        <span class="dot"></span>
        <span class="timer" id="t">0:00</span>
        <button class="stop" id="stop" title="停止錄影（F10）">停止</button>
    </div>
    <script>
        let s = 0;
        const t = document.getElementById('t');
        const fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
        setInterval(() => { s++; t.textContent = fmt(s); }, 1000);
        document.getElementById('stop').addEventListener('click', async () => {
            try { await window.__TAURI_INTERNALS__.invoke('stop_recording'); } catch (e) { }
        });
    </script>
</body>

</html>
